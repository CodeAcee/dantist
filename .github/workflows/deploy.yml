name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
  # a Sanity webhook publishes content -> rebuild (POST /repos/CodeAcee/dantist/dispatches)
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # ── Build for Hostiq (base "/") ──────────────────────────────
      - run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: ry5ky7kc
          PUBLIC_SANITY_DATASET: production
          PUBLIC_CONTACT_WORKER_URL: ${{ secrets.PUBLIC_CONTACT_WORKER_URL }}
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}

      - name: Upload to Hostiq via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: false

  # Pages builds on its own, so an FTP failure never blocks it
  build-pages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # ── Build for GitHub Pages (base "/dantist") ─────────────────
      - run: npx astro build --base /dantist --outDir dist-gh
        env:
          PUBLIC_SANITY_PROJECT_ID: ry5ky7kc
          PUBLIC_SANITY_DATASET: production
          PUBLIC_CONTACT_WORKER_URL: ${{ secrets.PUBLIC_CONTACT_WORKER_URL }}
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}

      # old preview links (/dantist/new/...) and unknown paths land on the site
      - name: Redirect old preview links
        run: |
          cat > dist-gh/404.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>Chirkova Dentist</title>
          <script>var p = location.pathname, n = p.replace(/^\/dantist\/new(\/|$)/, '/dantist/'); location.replace((n === p ? '/dantist/' : n) + location.search + location.hash)</script>
          <a href="/dantist/">Chirkova Dentist</a>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-gh

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
