<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- the pearl orb from the nav: the same pastel ring, a soft sheen, a hint of a rim -->
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb8d7"/>
      <stop offset=".35" stop-color="#ffe9a8"/>
      <stop offset=".65" stop-color="#a9ecc9"/>
      <stop offset="1" stop-color="#a8cfff"/>
    </linearGradient>
    <radialGradient id="s" cx=".35" cy=".3" r=".62">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="15" fill="url(#p)"/>
  <circle cx="16" cy="16" r="15" fill="url(#s)"/>
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#121417" stroke-opacity=".22" stroke-width="1"/>
</svg>
